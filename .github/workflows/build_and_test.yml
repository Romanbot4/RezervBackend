name: Build And Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore RezervBackend.sln

      - name: Build
        run: dotnet build RezervBackend.sln --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test UnitTests/UnitTests.csproj \
            --no-build --configuration Release --nologo
